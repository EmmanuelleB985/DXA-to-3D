name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install linting tools
        run: pip install flake8 black isort mypy

      - name: Check formatting with black
        run: black --check --diff .

      - name: Check import order with isort
        run: isort --check-only --diff --profile black .

      - name: Lint with flake8
        run: flake8 .

      - name: Type check with mypy
        run: mypy model.py train.py inference.py utils.py --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Validate module imports
        run: |
          python -m py_compile model.py
          python -m py_compile train.py
          python -m py_compile inference.py
          python -m py_compile utils.py
          python -m py_compile dataset.py
          python -m py_compile config.py
      